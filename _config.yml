title: Miguel Parracho
description: Tech Lead | Data Engineering | Artificial Intelligence
author: Miguel Parracho
email: mrparracho@gmail.com
url: https://mrparracho.github.io
baseurl: ""

# Jekyll configuration
theme: jekyll-theme-minimal
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md
  - DEPLOYMENT.md
  - package.json
  - package-lock.json
  # Backend service and its data must never be published by GitHub Pages.
  # (Holds the RAG corpus, CV PDF, ChromaDB and server code.)
  - backend
  # Internal/experimental pages — not part of the public site.
  - orb.html
  - sphere-test.html
